name: AlmostApps
description: >-
  AlmostApps is a Sacramento, California sports-gaming studio founded in 2022 that builds
  free-to-play mobile entertainment experiences for sports fans, blending casual gameplay
  with real-life sports scores and stats. Its flagship product, Tailgate, is a free-to-play
  mobile sports entertainment app designed to enhance the game-day experience for casual
  sports enthusiasts. The company is backed by Andreessen Horowitz (a16z) and Parade Ventures.
  AlmostApps is a consumer application company and does not currently publish a public developer
  API, developer portal, SDK, or API documentation; only a marketing site with Terms of Service
  and Privacy Policy is publicly available. This profile was surfaced as an a16z portfolio company
  and added to the API Evangelist network as a company lead.
